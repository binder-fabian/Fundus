[project]
name = "fundus"
version = "0.1.0"
description = "Fundus – Katalog und Ausleihe für Schulen"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14",
    "django-simple-history>=3.13",
    "psycopg[binary]>=3.3",
    "gunicorn>=26",
    "waitress>=3.0",
    "whitenoise>=6.12",
    "pillow>=11",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "reportlab>=4.2",
    "python-docx>=1.2.0",
    "mozilla-django-oidc>=4.0",
    "ldap3>=2.9",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=9",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fundus.test_settings"
testpaths = ["tests"]
addopts = "--strict-markers"
# ldap3 nutzt noch alte Namen aus pyasn1; harmlos.
filterwarnings = ["ignore:.*(tagMap|typeMap) is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM"]
