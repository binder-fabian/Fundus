{% if page.has_other_pages %}
  <nav class="pagination" aria-label="Seiten">
    {% if page.has_previous %}<a class="button" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}seite={{ page.previous_page_number }}">‹ Zurück</a>{% endif %}
    <span>Seite {{ page.number }} von {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="button" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}seite={{ page.next_page_number }}">Weiter ›</a>{% endif %}
  </nav>
{% endif %}
