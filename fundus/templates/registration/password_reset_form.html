{% extends "base.html" %}
{% block title %}Passwort vergessen{% endblock %}
{% block content %}
  <div class="narrow">
    <h1>Passwort vergessen</h1>
    <p>Geben Sie Ihre E-Mail-Adresse ein. Sie bekommen einen Link, mit dem Sie ein neues Passwort festlegen.</p>
    <form method="post" class="form">{% csrf_token %}{% include "form_fields.html" %}
      <button class="button button-primary button-block">Link schicken</button>
    </form>
  </div>
{% endblock %}
