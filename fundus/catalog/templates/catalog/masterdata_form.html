{% extends "base.html" %}
{% block title %}{{ singular }}{% endblock %}
{% block content %}
  <div class="narrow">
    <p><a href="{% url 'masterdata_list' kind %}">‹ {{ plural }}</a></p>
    <h1>{% if object %}{{ object }}{% else %}{{ singular }} anlegen{% endif %}</h1>
    <form method="post" class="form">{% csrf_token %}{% include "form_fields.html" %}
      <div class="actions">
        <button class="button button-primary">Speichern</button>
        <a class="button" href="{% url 'masterdata_list' kind %}">Abbrechen</a>
        {% if object %}<button class="button button-danger" name="delete" value="1" formnovalidate>Löschen</button>{% endif %}
      </div>
    </form>
  </div>
{% endblock %}
