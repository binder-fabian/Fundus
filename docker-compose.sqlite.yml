# Fundus mit SQLite – ein einziger Container, für kleine Schulen.
#   cp .env.example .env    # SECRET_KEY eintragen
#   docker compose -f docker-compose.sqlite.yml up -d

name: fundus

services:
  app:
    image: ghcr.io/binder-fabian/fundus:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/fundus.sqlite3
    ports:
      - "${FUNDUS_PORT:-8000}:8000"
    volumes:
      - fundus-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Verschickt einmal täglich die E-Mail-Erinnerungen (gleiches Image).
  scheduler:
    image: ghcr.io/binder-fabian/fundus:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/fundus.sqlite3
      MIGRATE_ON_START: "0"
    command: ["python", "manage.py", "run_scheduler"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/fundus-scheduler-heartbeat') > 180)"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - fundus-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  fundus-data:
