# Fundus mit PostgreSQL (Standard).
#   cp .env.example .env    # SECRET_KEY und POSTGRES_PASSWORD eintragen
#   docker compose up -d    # oder: podman compose up -d
# Für kleine Schulen ohne PostgreSQL: docker-compose.sqlite.yml
# Selbst bauen statt fertiges Image laden: zusätzlich -f docker-compose.build.yml

name: fundus

services:
  app:
    image: ghcr.io/binder-fabian/fundus:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://fundus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/fundus
    ports:
      - "${FUNDUS_PORT:-8000}:8000"
    volumes:
      - fundus-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Verschickt einmal täglich die E-Mail-Erinnerungen (gleiches Image).
  scheduler:
    image: ghcr.io/binder-fabian/fundus:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://fundus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/fundus
      MIGRATE_ON_START: "0"
    command: ["python", "manage.py", "run_scheduler"]
    healthcheck:
      disable: true
    volumes:
      - fundus-data:/data
    depends_on:
      app:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundus
      POSTGRES_DB: fundus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - fundus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundus -d fundus"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fundus-data:
  fundus-db:
